# Azure Pipelines equivalent of .github/workflows/{tests,security}.yml
#
# agentPool:
#   self-hosted      -> agent registered in the "Default" pool (uses system python3)
#   microsoft-hosted -> ubuntu-latest hosted agent (Python 3.11/3.12 matrix)
parameters:
  - name: agentPool
    displayName: Agent pool
    type: string
    default: self-hosted
    values:
      - self-hosted
      - microsoft-hosted

trigger:
  branches:
    include:
      - "*"

pr:
  branches:
    include:
      - "*"

pool:
  ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    name: Default
  ${{ else }}:
    vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.18.4"
  VENV: $(Agent.TempDirectory)/venv

stages:
  - stage: Test
    jobs:
      - job: pytest
        ${{ if eq(parameters.agentPool, 'microsoft-hosted') }}:
          strategy:
            matrix:
              py311:
                pythonVersion: "3.11"
              py312:
                pythonVersion: "3.12"
        steps:
          - ${{ if eq(parameters.agentPool, 'microsoft-hosted') }}:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(pythonVersion)
          - script: |
              python3 -m venv "$(VENV)"
              "$(VENV)/bin/pip" install -r requirements.txt
            displayName: Install dependencies
          - script: '"$(VENV)/bin/pytest" -v --junitxml=test-results.xml'
            displayName: Run pytest
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml
              testRunTitle: pytest

  - stage: Security
    dependsOn: []
    jobs:
      - job: bandit
        displayName: SAST (Bandit)
        steps:
          - ${{ if eq(parameters.agentPool, 'microsoft-hosted') }}:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(PYTHON_VERSION)
          - script: |
              python3 -m venv "$(VENV)"
              "$(VENV)/bin/pip" install bandit
            displayName: Install Bandit
          - script: '"$(VENV)/bin/bandit" -r src dashboard data -ll -f txt'
            displayName: Run Bandit (fail on medium+ severity)
          - script: '"$(VENV)/bin/bandit" -r src dashboard data -f json -o "$(Build.ArtifactStagingDirectory)/bandit-report.json" || true'
            displayName: Bandit JSON report
            condition: always()
          - publish: $(Build.ArtifactStagingDirectory)/bandit-report.json
            artifact: bandit-report
            condition: always()

      - job: pip_audit
        displayName: Dependency audit (pip-audit)
        steps:
          - ${{ if eq(parameters.agentPool, 'microsoft-hosted') }}:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(PYTHON_VERSION)
          - script: |
              python3 -m venv "$(VENV)"
              "$(VENV)/bin/pip" install pip-audit
            displayName: Install pip-audit
          - script: '"$(VENV)/bin/pip-audit" -r requirements.txt --desc'
            displayName: Audit requirements.txt for known CVEs

      - job: secrets
        displayName: Secret scan (Gitleaks)
        steps:
          - checkout: self
            fetchDepth: 0
          - script: |
              curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$(GITLEAKS_VERSION)/gitleaks_$(GITLEAKS_VERSION)_linux_x64.tar.gz" \
                | tar -xz -C "$(Agent.TempDirectory)" gitleaks
            displayName: Install Gitleaks
          - script: '"$(Agent.TempDirectory)/gitleaks" detect --source . --redact --verbose'
            displayName: Scan full git history
